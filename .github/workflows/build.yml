name: Build PequeLey APK

# Este workflow compila la aplicación de verdad (Android SDK + Google Maven
# están disponibles en los runners de GitHub Actions, a diferencia del
# entorno de generación de este proyecto). Ver docs/BUILD_REPORT.md para
# el detalle de por qué la compilación no pudo verificarse localmente.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Compilar, testear y empaquetar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Limpiar proyecto
        run: ./gradlew clean --no-daemon

      - name: Ejecutar tests unitarios (domain + data)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Ejecutar lint
        run: ./gradlew lintDebug --no-daemon

      - name: Publicar reporte de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Calcular SHA-256 del APK
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/PequeLey-v1.0.0.apk
          sha256sum deliverables/PequeLey-v1.0.0.apk | tee deliverables/PequeLey-v1.0.0.apk.sha256

      - name: Publicar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: PequeLey-v1.0.0-apk
          path: |
            deliverables/PequeLey-v1.0.0.apk
            deliverables/PequeLey-v1.0.0.apk.sha256
